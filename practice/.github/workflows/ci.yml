name: sai CI pipeline

on:
  push:
    branches:
      - main
      - featurebranch
  pull_request:
    branches:
      - main
      - featurebranch

jobs:
  test:
    runs-on: ubuntu latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-python@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install dependencies
        run: npm install

      - name: run tests
        run: npm test
